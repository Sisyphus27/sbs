<span id="ledger-status-{{ it.id }}"
      data-ledger-status
      class="ledger-status {{ 'is-skipped' if it.is_skipped else 'is-logged' if it.is_settlement_ready else 'is-unresolved' }}{{ ' is-zero' if it.is_zero else '' }}">
  {% if it.is_skipped %}本周跳过{% elif it.is_zero %}已补录 · 0 次失败{% elif it.is_settlement_ready %}已补录{% else %}待处理{% endif %}
</span>
