{% extends "base.html" %}
{% block title %}动作管理{% endblock %}
{% block content %}
<h1>动作管理</h1>
<h2>新增动作</h2>
<form hx-post="{{ url_for('lifts.new') }}" hx-target="#lift-list" hx-swap="beforeend" class="row">
  <input name="name" placeholder="动作名">
  <select name="load_model" id="new-load-model">
    <option value="barbell">barbell</option>
    <option value="bodyweight">bodyweight</option>
    <option value="pure_bodyweight">pure_bodyweight</option>
  </select>
  <select name="mode" id="new-mode">
    <option value="sbs">sbs</option>
    <option value="linear_t2">linear_t2</option>
    <option value="linear_t3">linear_t3</option>
    <option value="none">none</option>
  </select>
  <select name="lift_kind"><option value="main">main</option><option value="aux">aux</option></select>
  <input name="day" type="number" placeholder="day" value="1" style="width:60px">
  <input name="sets" type="number" placeholder="sets" value="3" style="width:60px">
  <input name="max" type="number" step="0.5" placeholder="max(sbs)" style="width:80px">
  <input name="start" type="number" step="0.5" placeholder="start(t2/t3)" style="width:90px">
  <input name="incr" type="number" step="0.5" placeholder="incr(t2/t3)" style="width:90px">
  <button>添加</button>
</form>

{# ADR 0005: 新建表单按 load_model 级联过滤合法 mode（is_legal_combo）。
   保留当前选中项；切 load_model 时自动选该 load_model 的首选项。 #}
<script>
(function () {
  var LEGAL = {
    barbell:        ['sbs', 'linear_t2', 'linear_t3'],
    bodyweight:     ['linear_t2', 'linear_t3'],
    pure_bodyweight:['none']
  };
  var lm = document.getElementById('new-load-model');
  var mode = document.getElementById('new-mode');
  if (!lm || !mode) return;
  function sync() {
    var allowed = LEGAL[lm.value] || [];
    var opts = mode.options;
    var still_legal = false;
    for (var i = 0; i < opts.length; i++) {
      var on = allowed.indexOf(opts[i].value) !== -1;
      opts[i].hidden = !on;
      opts[i].disabled = !on;
      if (opts[i].selected && on) still_legal = true;
    }
    if (!still_legal) mode.value = allowed[0];
  }
  lm.addEventListener('change', sync);
  sync();
})();
</script>

<h2>现有动作</h2>
<div id="lift-list">
  {% for lift in lifts %}
    {% include "_lift_row.html" %}
  {% endfor %}
</div>
{% endblock %}
