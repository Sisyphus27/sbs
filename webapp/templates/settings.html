{% extends "base.html" %}
{% block title %}全局参数{% endblock %}
{% block content %}
<h1>全局参数</h1>
<form method="post" action="{{ url_for('settings.update') }}">
  <div class="row"><label>最小变动 (kg): <input type="number" step="0.5" name="rounding" value="{{ s.rounding }}"></label></div>
  <div class="row"><label>days_per_week: <input type="number" name="days_per_week" value="{{ s.days_per_week }}"></label>
    <button type="submit" formaction="{{ url_for('settings.reset_field', field='days_per_week') }}" formnovalidate>↺ 默认</button>
  </div>
  <div class="row"><label>incr (kg): <input type="number" step="{{ s.rounding }}" name="incr" value="{{ s.incr }}"></label></div>
  <div class="row"><label>t2_reset_pct: <input type="number" step="0.05" name="t2_reset_pct" value="{{ s.t2_reset_pct }}"></label>
    <button type="submit" formaction="{{ url_for('settings.reset_field', field='t2_reset_pct') }}" formnovalidate>↺ 默认</button>
  </div>
  <div class="row"><label>t2_fail: <input type="number" name="t2_fail" value="{{ s.t2_fail }}"></label>
    <button type="submit" formaction="{{ url_for('settings.reset_field', field='t2_fail') }}" formnovalidate>↺ 默认</button>
  </div>
  <div class="row"><label>t3_target: <input type="number" name="t3_target" value="{{ s.t3_target }}"></label>
    <button type="submit" formaction="{{ url_for('settings.reset_field', field='t3_target') }}" formnovalidate>↺ 默认</button>
  </div>
  <div class="row"><label>体重 (kg): <input type="number" step="0.1" name="bodyweight" value="{{ s.bodyweight }}"></label></div>
  <button>保存</button>
</form>
{% endblock %}
